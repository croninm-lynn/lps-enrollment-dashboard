<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Usage Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Roboto+Slab:wght@700&display=swap">
<style>
/* Layout: LPS dashboard header over a roster ledger. Platforms run across, audiences run down, and the period control governs every number on the page. */
:root {
  --bg: #f2f5f8; --panel: #fcfcfb; --ink: #14202e; --ink-2: #4b5a6a; --ink-3: #6b7987;
  --line: #d9e0e7; --line-2: #e8edf1; --chip: #e4eaf0; --focus: #14202e;
  --ixl: #1baf7a; --bm: #2a78d6; --ell: #eb6834; --all: #4b5a6a;
  --navy: #292f60; --gold: #eca61f; --band-sub: #bfc6e0; --title: #292f60; --head-bg: rgb(255 255 255 / .94);
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --slab: "Roboto Slab", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 56px; display: grid; gap: 40px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.inner { max-width: 1180px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.topband { background: var(--navy); color: #fff; padding-block: 9px; font-size: 12px; }
.topband .inner { gap: 2px 16px; }
.org { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.unit { color: var(--band-sub); font-weight: 500; letter-spacing: .02em; }
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head-bg); backdrop-filter: blur(10px); border-bottom: 3px solid var(--gold); padding-block: 12px; }
.site-head .inner { gap: 10px 24px; }
.brand { display: flex; align-items: center; gap: 15px; min-width: 0; }
.logo { height: 48px; width: auto; display: block; flex: none; background: #fff; padding: 4px 6px; border: 2px solid var(--navy); border-radius: 6px; box-sizing: content-box; }
.titles { border-left: 1px solid var(--line); padding-left: 16px; min-width: 0; }
h1 { font: 700 20px/1.15 var(--slab); color: var(--title); letter-spacing: -.01em; }
.subtitle { font-size: 12.5px; color: var(--ink-2); font-weight: 500; margin-top: 3px; }
.filter { display: flex; flex-direction: column; gap: 5px; }
.filter-lab { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.lede { color: var(--ink-2); font-size: 16px; max-width: 68ch; margin-bottom: -16px; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--chip); padding: 3px; border-radius: 8px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .14); }

section { display: grid; gap: 14px; min-width: 0; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 6px 20px; }
h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.sec-sub { color: var(--ink-2); font-size: 14px; max-width: 72ch; }

.plats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.plat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.plat-name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.big { font-size: clamp(34px, 4vw, 44px); line-height: 1; font-weight: 800; letter-spacing: -.025em; }
.lab { color: var(--ink-2); font-size: 13px; line-height: 1.3; margin-top: 5px; }
.aud { border-top: 1px solid var(--line-2); padding-top: 12px; display: grid; gap: 6px; }
.aud-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.aud-name { font-weight: 600; font-size: 14px; }
.aud-pct { font-weight: 700; font-size: 20px; }
.meter { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--c) 17%, transparent); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c); border-radius: 4px; }
.aud-det { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; color: var(--ink-2); font-size: 13px; }
.aud.none { color: var(--ink-3); font-size: 14px; }

.months { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 18px 10px; min-width: 0; }
.m-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1fr); gap: 8px 32px; align-items: end; padding-block: 14px; border-top: 1px solid var(--line-2); }
.m-row.m-h { border-top: 0; padding-block: 10px 0; font-size: 13px; color: var(--ink-2); font-weight: 600; align-items: start; }
.m-pop { align-self: center; font-weight: 600; line-height: 1.3; }
.m-pop .plat-name { font-size: 15px; font-weight: 700; }
.m-pop small { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); padding-left: 18px; }
.cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; }
.col { border: 0; background: none; padding: 0; cursor: pointer; display: grid; gap: 4px; justify-items: center; min-width: 0; }
.col .plot { position: relative; width: 100%; height: 76px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.col .val { position: relative; font-size: 12.5px; font-weight: 600; line-height: 1.2; padding-bottom: 3px; white-space: nowrap; }
.col .fill { position: relative; width: 100%; background: var(--c); border-radius: 4px 4px 0 0; }
.col .track { position: absolute; bottom: 1px; left: 0; right: 0; height: 56px; background: color-mix(in srgb, var(--c) 17%, transparent); border-radius: 4px 4px 0 0; }
.col .base { width: 100%; height: 1px; background: var(--line); }
.col.partial .fill { background: color-mix(in srgb, var(--c) 45%, var(--panel)); }
.col .mon { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.col[aria-pressed="true"] .mon { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.col:hover .val { text-decoration: underline; text-underline-offset: 2px; }

.trend { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px 8px; min-width: 0; display: grid; gap: 8px; }
.tr-legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; font-weight: 600; }
.tr-legend span { display: inline-flex; align-items: center; gap: 7px; }
.tr-legend i { width: 18px; height: 3px; border-radius: 1.5px; background: var(--c); }
.tr-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
.tr-panel + .tr-panel { border-top: 1px solid var(--line-2); padding-top: 10px; margin-top: 4px; }
.trend-plot { display: block; max-width: 100%; touch-action: pan-y; }
.trend-plot text { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
.trend-plot text.pk { fill: var(--ink); font-weight: 600; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.trend-table { border-top: 1px solid var(--line-2); padding-block: 8px; font-size: 14px; }
.trend-table summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
.trend-table summary:hover { color: var(--ink); }
.trend-table .table-scroll { overflow-x: auto; margin-top: 8px; }
.trend-table th:first-child { text-align: left; }
.trend-table td:first-child { min-width: 120px; }

.table-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 12px; text-align: right; white-space: nowrap; }
tbody tr + tr td { border-top: 1px solid var(--line-2); }
th { font-weight: 600; font-size: 13px; color: var(--ink-2); vertical-align: bottom; }
thead tr:last-child th { border-bottom: 1px solid var(--line); }
th.grp { text-align: center; padding-bottom: 0; color: var(--ink); }
th[data-k="0"], td:first-child { text-align: left; font-weight: 500; white-space: normal; min-width: 200px; }
.sort { border: 0; background: none; padding: 0; font-weight: 600; cursor: pointer; color: inherit; }
.sort:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
th[aria-sort] .sort { color: var(--ink); }
th[aria-sort="descending"] .sort::after { content: " ↓"; }
th[aria-sort="ascending"] .sort::after { content: " ↑"; }
td.spark { width: 22%; min-width: 130px; padding-left: 6px; }
.spark i { display: block; height: 8px; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--c); }
.na { color: var(--ink-3); }

.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 36px; color: var(--ink-2); font-size: 14px; }
.notes p { max-width: 62ch; }
.notes b { color: var(--ink); font-weight: 600; }

#tip { position: fixed; z-index: 20; pointer-events: none; white-space: pre-line; background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.35; padding: 6px 9px; border-radius: 6px; max-width: 240px; }

@media (max-width: 700px) { .site-head { position: static; } }
@media (max-width: 900px) {
  .plats { grid-template-columns: minmax(0, 1fr); }
  .m-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 18px; }
  .m-pop { grid-column: 1 / -1; }
  .m-row.m-h { display: none; }
  .m-sublab { display: block !important; }
  .notes { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 460px) { .col .val { font-size: 11px; } .col .mon { font-size: 10.5px; } }
.m-sublab { display: none; font-size: 12px; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }
@media (prefers-reduced-motion: no-preference) { .meter i, .spark i, .col .fill { transition: width .22s ease, height .22s ease; } }
</style>
</head>

      const p = D.pops.find(x => x.plat === pl.id && x.aud === aud);
      if (!p) return `<div class="aud none">No student accounts rostered</div>`;
      const [au] = D.stats[p.id][state.period];
      const v = pct(au, p.roster);
      return `<div class="aud">
        <div class="aud-top"><span class="aud-name">${aud}</span><span class="aud-pct">${pct0(v)}</span></div>
        <div class="meter" role="img" aria-label="${pct0(v)} of ${aud.toLowerCase()} accounts logged in"><i style="width:${v.toFixed(2)}%"></i></div>
        <div class="aud-det"><span>${num(au)} of ${num(p.roster)} accounts</span></div>
      </div>`;
    }).join("");
    return `<article class="plat" style="--c:var(--${pl.id})">
      <h3 class="plat-name"><span class="swatch"></span>${esc(pl.name)}</h3>
      <div><div class="big">${pct0(pct(u, pl.roster))}</div><div class="lab">of ${num(pl.roster)} accounts logged in</div></div>
      ${rows}
    </article>`;
  }).join("");
}

function bars(p, metric) {
  const vals = months.map(m => D.stats[p.id][m.id]);
  const max = metric === "pct" ? 100 : Math.max(1, ...vals.map(v => v[1]));
  return `<div class="cols" style="--n:${months.length}">` + months.map((m, i) => {
    const [u, l] = vals[i];
    const v = metric === "pct" ? pct(u, p.roster) : l;
    const h = Math.round(56 * v / max);
    const label = metric === "pct" ? pct0(v) : compact(l);
    const tip = `${popName(p)}, ${m.range}: ${num(u)} of ${num(p.roster)} accounts (${pct0(pct(u, p.roster))}), ${num(l)} launches`;
    return `<button class="col${m.partial ? " partial" : ""}" data-period="${m.id}" aria-pressed="${m.id === state.period}" data-tip="${esc(tip)}" aria-label="${esc(tip)}">
      <span class="plot">${metric === "pct" ? `<span class="track"></span>` : ""}<span class="val">${label}</span><span class="fill" style="height:${v > 0 ? Math.max(h, 2) : 0}px"></span><span class="base"></span></span>
      <span class="mon">${esc(m.label)}</span></button>`;
  }).join("") + "</div>";
}

function renderMonths() {
  const head = `<div class="m-row m-h"><span>Group</span><span>Percentage of accounts logged in</span><span>App launches (scale varies per app and users)</span></div>`;
  $("months").innerHTML = head + D.pops.map(p => `<div class="m-row" style="--c:var(--${p.plat})">
    <div class="m-pop"><div class="plat-name"><span class="swatch"></span>${esc(platName(p.plat))}</div><small>${p.aud}</small></div>
    <div><span class="m-sublab">% of accounts logged in</span>${bars(p, "pct")}</div>
    <div><span class="m-sublab">App launches, own scale</span>${bars(p, "launch")}</div>
  </div>`).join("");
}

const TR = { ml: 46, mr: 26, mt: 22 };
let trendPanels = [];

function niceScale(v, parts) {
  const raw = Math.max(v, 1) / parts;
  const pow = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].find(m => m * pow >= raw) * pow;
  return { step, max: Math.ceil(v / step) * step };
}

function panelSvg(index, series, W, H, mb, parts, named, showX) {
  const n = D.weeks.length;
  const { step, max } = niceScale(Math.max(...series.flatMap(s => s.vals)), parts);
  const x = i => TR.ml + i * (W - TR.ml - TR.mr) / (n - 1);
  const y = v => TR.mt + (H - TR.mt - mb) * (1 - v / max);
  trendPanels[index] = { x, y, series };
  let out = "";
  for (let t = 0; t <= max; t += step) {
    out += `<line x1="${TR.ml}" x2="${W - TR.mr}" y1="${y(t)}" y2="${y(t)}" stroke="var(${t ? "--line-2" : "--line"})"/>`;
    out += `<text x="${TR.ml - 8}" y="${y(t) + 4}" text-anchor="end">${compact(t)}</text>`;
  }
  if (showX) {
    const every = Math.ceil(62 / ((W - TR.ml - TR.mr) / (n - 1)));
    D.weeks.forEach((w, i) => {
      if (i % every === 0) out += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(w.label)}</text>`;
    });
  }
  series.forEach(s => {
    const d = s.vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join("");
    out += `<path d="${d}" fill="none" stroke="var(--${s.id})" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  series.forEach(s => {
    const pk = s.vals.indexOf(Math.max(...s.vals));
    const px = x(pk), anchor = px > W - 60 ? "end" : px < TR.ml + 40 ? "start" : "middle";
    const text = (named ? s.name + " " : "") + compact(s.vals[pk]);
    out += `<circle cx="${px}" cy="${y(s.vals[pk])}" r="4" fill="var(--${s.id})" stroke="var(--panel)" stroke-width="2"/>`;
    out += `<text class="pk" x="${px}" y="${y(s.vals[pk]) - 9}" text-anchor="${anchor}">${esc(text)}</text>`;
  });
  out += `<line class="xh" y1="${TR.mt}" y2="${H - mb}" stroke="var(--ink-3)" visibility="hidden"/>`;
  series.forEach(s => {
    out += `<circle class="hv" data-s="${s.id}" r="4" fill="var(--${s.id})" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>`;
  });
  const label = series.map(s => `${s.name} peaks at ${num(Math.max(...s.vals))} launches`).join(", ");
  return `<svg class="trend-plot" data-p="${index}" width="100%" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly app launches. ${esc(label)}. Exact numbers are in the table below.">${out}</svg>`;
}

function renderTrend() {
  const box = $("trendPlot");
  const W = Math.max(box.clientWidth, 280);
  box.dataset.w = W;
  trendPanels = [];
  const series = D.plats.map(p => ({ id: p.id, name: p.name, vals: D.weeks.map(w => w.counts[p.id]) }));
  if (state.trend === "same") {
    const legend = series.map(s => `<span style="--c:var(--${s.id})"><i></i>${esc(s.name)}</span>`).join("");
    box.innerHTML = `<div class="tr-legend" style="margin-bottom:8px">${legend}</div>` +
      panelSvg(0, series, W, W < 560 ? 250 : 320, 26, 5, true, true);
  } else {
    box.innerHTML = series.map((s, i) => {
      const last = i === series.length - 1;
      return `<div class="tr-panel"><div class="tr-title" style="--c:var(--${s.id})"><span class="swatch"></span>${esc(s.name)}</div>` +
        panelSvg(i, [s], W, last ? 146 : 128, last ? 26 : 8, 3, false, last) + `</div>`;
    }).join("");
  }
}

function renderWeekTable() {
  $("weekHead").innerHTML = "<th>Week</th>" + D.plats.map(p => `<th>${esc(p.name)}</th>`).join("") + "<th>All platforms</th>";
  $("weekRows").innerHTML = D.weeks.map(w => {
    const vals = D.plats.map(p => w.counts[p.id]);
    return `<tr><td>${esc(w.range)}</td>${vals.map(v => `<td>${num(v)}</td>`).join("")}<td>${num(vals.reduce((a, b) => a + b, 0))}</td></tr>`;
  }).join("");
}

function clearTrendHover() {
  document.querySelectorAll(".trend-plot .xh, .trend-plot .hv").forEach(el => el.setAttribute("visibility", "hidden"));
}

function trendHover(svg, e) {
  const panel = trendPanels[+svg.dataset.p];
  const rect = svg.getBoundingClientRect();
  const n = D.weeks.length;
  const W = +$("trendPlot").dataset.w;
  const px = (e.clientX - rect.left) * (W / rect.width);
  const i = Math.max(0, Math.min(n - 1, Math.round((px - TR.ml) / (W - TR.ml - TR.mr) * (n - 1))));
  document.querySelectorAll(".trend-plot").forEach(el => {
    const pn = trendPanels[+el.dataset.p];
    const line = el.querySelector(".xh");
    line.setAttribute("x1", pn.x(i)); line.setAttribute("x2", pn.x(i)); line.setAttribute("visibility", "visible");
    pn.series.forEach(s => {
      const dot = el.querySelector(`.hv[data-s="${s.id}"]`);
      dot.setAttribute("cx", pn.x(i)); dot.setAttribute("cy", pn.y(s.vals[i])); dot.setAttribute("visibility", "visible");
    });
  });
  const w = D.weeks[i];
  placeTip(w.range + "\n" + D.plats.map(p => `${p.name}: ${num(w.counts[p.id])}`).join("\n"), e.clientX, e.clientY);
}

function renderSchools() {
  const raw = D.schools[state.period][state.plat].map(r => [...r, r[2] + r[4]]);
  const k = state.sort, dir = state.dir;
  raw.sort((a, b) => k === 0 ? dir * String(a[0]).localeCompare(b[0]) : dir * (a[k] - b[k]) || a[0].localeCompare(b[0]));
  const max = Math.max(1, ...raw.map(r => r[5]));
  const noStud = state.plat === "bm";
  const c = state.plat === "all" ? "--all" : "--" + state.plat;
  const cell = (v) => noStud ? `<td class="na">—</td>` : `<td>${num(v)}</td>`;
  const rows = raw.map(r => `<tr>
    <td>${esc(r[0])}</td><td>${num(r[1])}</td>${cell(r[3])}<td>${num(r[2])}</td>${cell(r[4])}
    <td class="spark" data-tip="${esc(r[0])}: ${num(r[5])} launches" style="--c:var(${c})"><span style="display:flex;align-items:center;gap:8px"><span style="min-width:52px">${num(r[5])}</span><span style="flex:1"><i style="width:${(100 * r[5] / max).toFixed(1)}%"></i></span></span></td>
  </tr>`).join("");
  $("schoolRows").innerHTML = rows || `<tr><td colspan="6" class="na">No launches for this platform in this period.</td></tr>`;
  document.querySelectorAll("th[data-k]").forEach(th => {
    if (+th.dataset.k === k) th.setAttribute("aria-sort", dir < 0 ? "descending" : "ascending");
    else th.removeAttribute("aria-sort");
  });
  const name = state.plat === "all" ? "all platforms" : platName(state.plat);
  $("schoolSub").textContent = `${raw.length} locations with launches on ${name}, ${period().range}.`;
}

function renderNotes() {
  const n = D.notes;
  $("notes").innerHTML = [
    `<p><b>Logged in</b> means an account launched the app at least once in the selected period. Each account counts once per platform, however many times it launched.</p>`,
    `<p><b>App launches</b> are counts from ${num(n.rows)} ClassLink App Launch Log. Sign-ins that skip ClassLink aren't included.</p>`,
    `<p><b>Staff</b> combines the Teacher and Tenant Admin roles. IXL combines the IXL and IXL - Admin apps. Ellevation combines Ellevation Staff and Ellevation Benchmark Students.</p>`,
    `<p><b>Dates:</b> this dashboard runs through ${esc(n.through)}.</p>`,
    `<p><b>Schools:</b> ${num(n.multiSchool)} accounts launched under two locations and count at each one, so account counts by school add up to slightly more than the platform totals. Launches add up exactly.</p>`
  ].join("");
}

function render() { renderSeg(); renderLede(); renderPlats(); renderMonths(); renderSchools(); renderNotes(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-period],[data-plat],[data-sort],[data-trend]");
  if (!t) return;
  if (t.dataset.period) state.period = t.dataset.period;
  else if (t.dataset.plat) state.plat = t.dataset.plat;
  else if (t.dataset.trend) { state.trend = t.dataset.trend; renderTrend(); }
  else {
    const k = +t.dataset.sort;
    if (state.sort === k) state.dir = -state.dir;
    else { state.sort = k; state.dir = k === 0 ? 1 : -1; }
  }
  $("tip").hidden = true;
  render();
});

const tip = $("tip");
function showTip(el, x, y) { placeTip(el.dataset.tip, x, y); }
function placeTip(text, x, y) {
  tip.textContent = text;
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x + 12)) + "px";
  tip.style.top = Math.max(8, Math.min(innerHeight - r.height - 8, y - r.height - 10)) + "px";
}
document.addEventListener("mousemove", e => {
  const svg = e.target.closest(".trend-plot");
  if (svg) { trendHover(svg, e); return; }
  clearTrendHover();
  const el = e.target.closest("[data-tip]");
  if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true;
});
document.addEventListener("focusin", e => {
  const el = e.target.closest("[data-tip]");
  if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left, r.top); }
});
document.addEventListener("focusout", () => { tip.hidden = true; });
window.addEventListener("scroll", () => { tip.hidden = true; clearTrendHover(); }, { passive: true });

render();
renderTrend();
renderWeekTable();
new ResizeObserver(() => {
  if ($("trendPlot").clientWidth !== +$("trendPlot").dataset.w) renderTrend();
}).observe($("trendPlot"));
</script>
</body>
</html>
