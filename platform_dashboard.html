  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

                 <div style=\"font-family:'Roboto Slab',serif;font-size:21px;font-weight:600;\">{{ it.count }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1340,&quot;height&quot;:900},&quot;districtName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lynn Public School District&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultMetric&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;active&quot;,&quot;minutes&quot;],&quot;default&quot;:&quot;active&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bmColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#46c8e2&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ixlColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#43e58c&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;elvColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f98a4e&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    metric: null, range: '4w', view: 'overview', layout: 'table',\n    search: '', bands: { pk5: true, m: true, h: true }, plats: { bm: true, ixl: true, elv: true },\n    sortKey: 'name', sortDir: 1, selected: null\n  };\n\n  WEEKS = ['May 8', 'May 15', 'May 22', 'May 29', 'Jun 5', 'Jun 12'];\n\n  mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\n  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }\n  hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }\n\n  buildData() {\n    const rnd = this.mulberry32(73108);\n    const rand = (a, b) => a + (b - a) * rnd();\n    const cl = (v, a, b) => this.clamp(v, a, b);\n    const defs = [\n      { name: 'Drewicz Elementary', band: 'pk5' },\n      { name: 'Aborn Elementary', band: 'pk5' },\n      { name: 'Brickett Elementary', band: 'pk5' },\n      { name: 'Shoemaker Elementary', band: 'pk5' },\n      { name: 'Cobbet Elementary', band: 'pk5' },\n      { name: 'Harrington Elementary', band: 'pk5' },\n      { name: 'Early Childhood Center', band: 'pk5' },\n      { name: 'Sisson Elementary', band: 'pk5' },\n      { name: 'Hood Elementary', band: 'pk5' },\n      { name: 'Ingalls Elementary', band: 'pk5' },\n      { name: 'Callahan Elementary', band: 'pk5' },\n      { name: 'Lincoln-Thomson Elementary', band: 'pk5' },\n      { name: 'Lynn Woods Elementary', band: 'pk5' },\n      { name: 'Ford Elementary', band: 'pk5' },\n      { name: 'Sewell-Anderson Elementary', band: 'pk5' },\n      { name: 'Tracy Elementary', band: 'pk5' },\n      { name: 'Washington Elementary', band: 'pk5' },\n      { name: 'Fallon Elementary', band: 'pk5' },\n      { name: 'Connery Elementary', band: 'pk5' },\n      { name: 'Breed Middle School', band: 'm' },\n      { name: 'Pickering Middle', band: 'm' },\n      { name: 'Thurgood Marshall Middle', band: 'm' },\n      { name: 'Harold Durgin Success Academy', band: 'm' },\n      { name: 'TEAMS Academy at Virginia Barton Center', band: 'm' },\n      { name: 'Lynn Classical High', band: 'h' },\n      { name: 'Lynn English High', band: 'h' },\n      { name: 'Lynn Vocational Technical Institute', band: 'h' },\n      { name: 'Frederick Douglass Collegiate Academy', band: 'h' },\n      { name: 'City Arts & Sciences Academy at Fecteau-Leary', band: 'h' }\n    ];\n    const plats = ['bm', 'ixl', 'elv'];\n    return defs.map((d, idx) => {\n      const engage = rand(0.5, 1.18);\n      const enrollment = Math.round(d.band === 'pk5' ? rand(300, 640) : d.band === 'm' ? rand(520, 940) : rand(880, 1750));\n      const metrics = {};\n      plats.forEach(p => {\n        let base = p === 'bm' ? 0.6 : p === 'ixl' ? 0.75 : 0.5;\n        if (p === 'elv') base *= d.band === 'h' ? 1.12 : d.band === 'm' ? 1.0 : 0.86;\n        if (p === 'ixl') base *= d.band === 'pk5' ? 1.12 : d.band === 'h' ? 0.82 : 1.0;\n        if (p === 'bm') base *= d.band === 'pk5' ? 1.05 : 0.95;\n        const apct = cl(base * engage * 100 * rand(0.85, 1.1), 8, 96);\n        const mbase = (p === 'ixl' ? rand(24, 48) : p === 'bm' ? rand(11, 27) : rand(8, 21)) * cl(engage, 0.6, 1.1);\n        const slope = rand(-0.7, 1.0);\n        const ta = [], tm = [];\n        for (let w = 0; w < 8; w++) { const t = w - 3.5; ta.push(cl(apct + slope * t * 1.5 + rand(-4, 4), 4, 98)); tm.push(cl(mbase + slope * t * 0.55 + rand(-2.5, 2.5), 3, 72)); }\n        metrics[p] = { ta, tm };\n      });\n      return { id: 's' + idx, name: d.name, band: d.band, enrollment, metrics };\n    });\n  }\n  data() { return this._data || (this._data = this.buildData()); }\n\n  get metric() { return this.state.metric || (this.props.defaultMetric === 'minutes' ? 'minutes' : 'active'); }\n  cur(arr) { return this.state.range === '1w' ? arr[7] : (arr[4] + arr[5] + arr[6] + arr[7]) / 4; }\n  prv(arr) { return this.state.range === '1w' ? arr[6] : (arr[0] + arr[1] + arr[2] + arr[3]) / 4; }\n  pick(arr, sel) { return sel === 'cur' ? this.cur(arr) : sel === 'prev' ? this.prv(arr) : arr[sel]; }\n  arrFor(m, p) { return this.metric === 'active' ? m[p].ta : m[p].tm; }\n  fmt(v) { return this.metric === 'active' ? Math.round(v) + '%' : Math.round(v) + 'm'; }\n\n  agg(schools, p, sel) {\n    if (this.metric === 'active') {\n      let act = 0, enr = 0;\n      schools.forEach(sc => { act += sc.enrollment * this.pick(sc.metrics[p].ta, sel) / 100; enr += sc.enrollment; });\n      return enr ? act / enr * 100 : 0;\n    }\n    let ws = 0, wt = 0;\n    schools.forEach(sc => { const w = sc.enrollment * this.cur(sc.metrics[p].ta) / 100; ws += w * this.pick(sc.metrics[p].tm, sel); wt += w; });\n    return wt ? ws / wt : 0;\n  }\n\n  spark(vals) { const w = 120, h = 30, p = 3; const mn = Math.min(...vals), mx = Math.max(...vals); const r = (mx - mn) || 1; return vals.map((v, i) => { const x = p + i * (w - 2 * p) / (vals.length - 1); const y = h - p - ((v - mn) / r) * (h - 2 * p); return x.toFixed(1) + ',' + y.toFixed(1); }).join(' '); }\n\n  platMeta() {\n    return [\n      { key: 'bm', short: 'BM', name: 'Branching Minds', color: this.props.bmColor || '#01cdfe', light: '#EEEAFC', dark: '#4A2FB0' },\n      { key: 'ixl', short: 'IXL', name: 'IXL', color: this.props.ixlColor || '#05ffa1', light: '#E3F4EB', dark: '#127A41' },\n      { key: 'elv', short: 'EL', name: 'Ellevation', color: this.props.elvColor || '#ffc56c', light: '#E5F1FB', dark: '#1A5A99' }\n    ];\n  }\n  bandLabel(b) { return b === 'pk5' ? 'PK\\u2013\\u20605' : b === 'm' ? '6\\u2013\\u20608' : '9\\u2013\\u206012'; }\n  bandDot(b) { return b === 'pk5' ? '#0B70AA' : b === 'm' ? '#ECA61F' : '#292F60'; }\n\n  heatColor(color, t) { t = this.clamp(t, 0, 1); const [r, g, b] = this.hexToRgb(color); const a = (0.1 + 0.82 * t).toFixed(2); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }\n\n  filteredSchools() {\n    const s = this.state, q = s.search.trim().toLowerCase();\n    return this.data().filter(sc => s.bands[sc.band] && (!q || sc.name.toLowerCase().includes(q)));\n  }\n\n  mkCells(schools, scaleMax) {\n    const plats = this.platMeta().filter(p => this.state.plats[p.key]);\n    return plats.map(p => {\n      const cur = this.agg(schools, p.key, 'cur'), prev = this.agg(schools, p.key, 'prev');\n      const d = prev ? (cur - prev) / prev * 100 : 0;\n      const pct = this.clamp(cur / scaleMax, 0.03, 1);\n      return {\n        key: p.key, short: p.short, name: p.name, color: p.color, light: p.light, dark: p.dark,\n        value: this.fmt(cur), raw: cur, bar: (pct * 100).toFixed(1) + '%',\n        heatBg: this.heatColor(p.color, cur / scaleMax), heatFg: cur / scaleMax > 0.5 ? '#fff' : '#292F60',\n        delta: Math.abs(d).toFixed(0) + '%', deltaArrow: d >= 0 ? '\\u2191' : '\\u2193', deltaColor: d >= 0 ? '#127A41' : '#D2483F'\n      };\n    });\n  }\n\n  renderVals() {\n    const S = this.state, metric = this.metric;\n    const allPlats = this.platMeta();\n    const plats = allPlats.filter(p => S.plats[p.key]);\n    const fs = this.filteredSchools();\n    const metricLabel = metric === 'active' ? 'Active rate' : 'Avg daily minutes';\n    const seg = (active) => ({ bg: active ? '#fff' : 'transparent', fg: active ? '#333333' : '#5B6170', sh: active ? '0 1px 2px rgba(20,25,35,.12)' : 'none' });\n\n    // scale max for bars/heat\n    let smax = 1; fs.forEach(sc => plats.forEach(p => { const v = this.cur(sc.metrics[p.key].tm); if (v > smax) smax = v; }));\n    const scaleMax = metric === 'active' ? 100 : smax;\n\n    // KPIs\n    const kpis = plats.map(p => {\n      const cur = this.agg(fs, p.key, 'cur'), prev = this.agg(fs, p.key, 'prev');\n      const weekly = [2, 3, 4, 5, 6, 7].map(wi => this.agg(fs, p.key, wi));\n      const count = fs.reduce((a, sc) => a + sc.enrollment * this.cur(sc.metrics[p.key].ta) / 100, 0);\n      const enroll = fs.reduce((a, sc) => a + sc.enrollment, 0);\n      const d = prev ? (cur - prev) / prev * 100 : 0;\n      return {\n        key: p.key, name: p.name, color: p.color, light: p.light, dark: p.dark,\n        value: this.fmt(cur), spark: this.spark(weekly),\n        sub: metric === 'active' ? Math.round(count).toLocaleString() + ' of ' + enroll.toLocaleString() + ' users active' : Math.round(count).toLocaleString() + ' active users this period',\n        delta: Math.abs(d).toFixed(1) + '%', deltaArrow: d >= 0 ? '\\u2191' : '\\u2193', deltaColor: d >= 0 ? '#127A41' : '#D2483F'\n      };\n    });\n\n    // trend chart\n    const series = plats.map(p => ({ key: p.key, color: p.color, vals: [2, 3, 4, 5, 6, 7].map(wi => this.agg(fs, p.key, wi)) }));\n    let mn = Infinity, mx = -Infinity; series.forEach(s => s.vals.forEach(v => { mn = Math.min(mn, v); mx = Math.max(mx, v); }));\n    if (!isFinite(mn)) { mn = 0; mx = 100; }\n    if (mx === mn) { mx += 5; mn -= 5; }\n    const padd = (mx - mn) * 0.18; const lo = Math.max(0, mn - padd), hi = mx + padd;\n    const L = 50, R = 18, T = 18, B = 36, W = 720, H = 250, iw = W - L - R, ih = H - T - B;\n    const xf = i => L + i * iw / 5, yf = v => T + ih - ((v - lo) / (hi - lo)) * ih;\n    const chart = {\n      ser: series.map(s => { const pts = s.vals.map((v, i) => xf(i).toFixed(1) + ',' + yf(v).toFixed(1)).join(' '); const li = s.vals.length - 1; return { key: s.key, color: s.color, points: pts, lastX: xf(li).toFixed(1), lastY: yf(s.vals[li]).toFixed(1) }; }),\n      yticks: [0, 1, 2, 3].map(i => { const v = lo + (hi - lo) * i / 3; const y = yf(v); return { y: y.toFixed(1), ty: (y + 4).toFixed(1), label: Math.round(v) + (metric === 'active' ? '%' : 'm') }; }),\n      xticks: this.WEEKS.map((w, i) => ({ x: xf(i).toFixed(1), label: w })),\n      yAxisLabel: metric === 'active' ? 'Active rate (%)' : 'Avg daily minutes',\n      xAxisLabel: 'Week ending'\n    };\n\n    // band rows\n    const bandDefs = [{ key: 'pk5' }, { key: 'm' }, { key: 'h' }].filter(b => S.bands[b.key]);\n    const bandRows = bandDefs.map(b => {\n      const bs = fs.filter(sc => sc.band === b.key);\n      const weekly = [2, 3, 4, 5, 6, 7].map(wi => { let s = 0; plats.forEach(p => s += this.agg(bs, p.key, wi)); return plats.length ? s / plats.length : 0; });\n      return { key: b.key, label: this.bandLabel(b.key), dot: this.bandDot(b.key), count: bs.length, enroll: bs.reduce((a, sc) => a + sc.enrollment, 0).toLocaleString(), cells: this.mkCells(bs, scaleMax), spark: this.spark(weekly) };\n    });\n\n    // school rows + sort\n    let rows = fs.map(sc => {\n      const cells = this.mkCells([sc], scaleMax);\n      const weekly = [2, 3, 4, 5, 6, 7].map(wi => { let s = 0; plats.forEach(p => s += this.arrFor(sc.metrics, p.key)[wi]); return plats.length ? s / plats.length : 0; });\n      return { id: sc.id, name: sc.name, band: this.bandLabel(sc.band), bandDot: this.bandDot(sc.band), bandKey: sc.band, cells, spark: this.spark(weekly), open: () => this.setState({ selected: sc.id }) };\n    });\n    const sk = S.sortKey, dir = S.sortDir, bo = { pk5: 0, m: 1, h: 2 };\n    rows.sort((a, b) => {\n      if (sk === 'name') return a.name.localeCompare(b.name) * dir;\n      if (sk === 'band') { const r = bo[a.bandKey] - bo[b.bandKey]; return r ? r * dir : a.name.localeCompare(b.name); }\n      const ca = a.cells.find(c => c.key === sk), cb = b.cells.find(c => c.key === sk);\n      return ((ca ? ca.raw : 0) - (cb ? cb.raw : 0)) * dir;\n    });\n\n    // table columns\n    const arrowFor = k => sk === k ? (dir < 0 ? '\\u25BC' : '\\u25B2') : '';\n    const cols = [\n      { key: 'name', label: 'School', align: 'left', justify: 'flex-start', dotShow: 'none', dot: 'transparent' },\n      { key: 'band', label: 'Band', align: 'left', justify: 'flex-start', dotShow: 'none', dot: 'transparent' }\n    ].concat(plats.map(p => ({ key: p.key, label: p.name, align: 'left', justify: 'flex-start', dotShow: 'inline-block', dot: p.color })))\n      .map(c => ({ ...c, arrow: arrowFor(c.key), fg: sk === c.key ? '#333333' : '#8C8F99', cursor: 'pointer', on: () => this.setSort(c.key) }));\n\n    // detail\n    let detail = null;\n    if (S.selected) {\n      const sc = this.data().find(x => x.id === S.selected);\n      if (sc) {\n        detail = {\n          name: sc.name, band: this.bandLabel(sc.band), bandDot: this.bandDot(sc.band), enrollment: sc.enrollment.toLocaleString(),\n          items: allPlats.map(p => {\n            const active = this.cur(sc.metrics[p.key].ta), minutes = this.cur(sc.metrics[p.key].tm);\n            const wk = [2, 3, 4, 5, 6, 7].map(wi => this.arrFor(sc.metrics, p.key)[wi]);\n            const cv = metric === 'active' ? active : minutes, pv = metric === 'active' ? this.prv(sc.metrics[p.key].ta) : this.prv(sc.metrics[p.key].tm);\n            const d = pv ? (cv - pv) / pv * 100 : 0;\n            return { name: p.name, color: p.color, light: p.light, dark: p.dark, active: Math.round(active) + '%', minutes: Math.round(minutes) + 'm', count: Math.round(sc.enrollment * active / 100).toLocaleString(), spark: this.spark(wk), delta: Math.abs(d).toFixed(1) + '%', deltaArrow: d >= 0 ? '\\u2191' : '\\u2193', deltaColor: d >= 0 ? '#127A41' : '#D2483F' };\n          })\n        };\n      }\n    }\n\n    return {\n      districtName: this.props.districtName || 'Lynn Public Schools',\n      subtitle: this.data().length + ' schools \\u00b7 3 platforms \\u00b7 Period ending Jun 12, 2026',\n      metricLabel, search: S.search,\n      onSearch: e => this.setState({ search: e.target.value }),\n      metricOpts: [{ key: 'active', label: 'Active rate' }, { key: 'minutes', label: 'Avg minutes' }].map(o => ({ label: o.label, on: () => this.setState({ metric: o.key }), ...seg(metric === o.key) })),\n      rangeOpts: [{ key: '1w', label: 'This week' }, { key: '4w', label: '4-week avg' }].map(o => ({ label: o.label, on: () => this.setState({ range: o.key }), ...seg(S.range === o.key) })),\n      viewTabs: [{ key: 'overview', label: 'Overview' }, { key: 'schools', label: 'Schools' }, { key: 'grade', label: 'Grade bands' }].map(o => ({ label: o.label, on: () => this.setState({ view: o.key }), fg: S.view === o.key ? '#292F60' : '#8C8F99', bd: S.view === o.key ? '#ECA61F' : 'transparent' })),\n      layoutOpts: [{ key: 'table', label: 'Table' }, { key: 'heatmap', label: 'Heatmap' }, { key: 'cards', label: 'Cards' }].map(o => ({ label: o.label, on: () => this.setState({ layout: o.key }), ...seg(S.layout === o.key) })),\n      bandChips: [{ key: 'pk5' }, { key: 'm' }, { key: 'h' }].map(b => { const on = S.bands[b.key]; return { label: this.bandLabel(b.key), dot: this.bandDot(b.key), on: () => this.toggleBand(b.key), bg: on ? '#fff' : '#FAFAFA', bd: on ? '#C9CDD6' : '#E0E0E0', fg: on ? '#333333' : '#A8ACB6', deco: on ? 'none' : 'line-through' }; }),\n      platChips: allPlats.map(p => { const on = S.plats[p.key]; return { label: p.name, dot: p.color, on: () => this.togglePlat(p.key), bg: on ? '#fff' : '#FAFAFA', bd: on ? '#C9CDD6' : '#E0E0E0', fg: on ? '#333333' : '#A8ACB6', deco: on ? 'none' : 'line-through' }; }),\n      plats, kpis, chart, bandRows, schoolRows: rows, cols,\n      gridCols: 'minmax(190px,1.6fr) 96px ' + plats.map(() => 'minmax(108px,1fr)').join(' '),\n      heatCols: 'minmax(170px,1.5fr) ' + plats.map(() => 'minmax(84px,1fr)').join(' '),\n      isOverview: S.view === 'overview', isSchools: S.view === 'schools', isGrade: S.view === 'grade',\n      isTable: S.layout === 'table', isHeatmap: S.layout === 'heatmap', isCards: S.layout === 'cards',\n      noRows: rows.length === 0,\n      modalOpen: !!detail, detail: detail || { items: [] },\n      closeModal: () => this.setState({ selected: null }), stop: e => e.stopPropagation()\n    };\n  }\n\n  setSort(k) { this.setState(s => ({ sortKey: k, sortDir: s.sortKey === k ? -s.sortDir : (k === 'name' || k === 'band' ? 1 : -1) })); }\n  toggleBand(k) { this.setState(s => { const n = { ...s.bands, [k]: !s.bands[k] }; if (!Object.values(n).some(Boolean)) return null; return { bands: n }; }); }\n  togglePlat(k) { this.setState(s => { const n = { ...s.plats, [k]: !s.plats[k] }; if (!Object.values(n).some(Boolean)) return null; return { plats: n }; }); }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
